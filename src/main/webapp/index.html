<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT School 受講生ポータル</title>

<!-- アンケートページと同じスタイルシートを採用 -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

<!-- Morphテーマ (アンケートページと統一) -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/morph/bootstrap.min.css">

<!-- ※ Bootstrap Icons の読み込み(linkタグ)は不要になったため削除済みです -->

<style>
/* Morphテーマのボタンをホバーした際のアニメーションを少し追加 */
.btn-animate {
	transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
}
.btn-animate:hover {
	transform: translateY(-3px);
}
</style>
</head>

<body class="bg-light">

	<!-- ナビゲーションバー (アンケートページとデザインを統一) -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
		<div class="container">
			<span class="navbar-brand fw-bold">
				🎓 IT School Special Portal
			</span>
		</div>
	</nav>

	<!-- メインコンテンツ -->
	<main class="container my-5">
		<div class="row justify-content-center text-center">
			<div class="col-lg-8">
				
				<!-- Morphテーマのカードを活用 -->
				<div class="card shadow border-0 p-5 bg-white rounded-5 mb-5">
					<div class="card-body">
						<h1 class="display-5 fw-bold text-dark mb-3">Welcome, Students!</h1>
						<p class="lead text-muted mb-5">
							セミナーをご受講いただき、誠にありがとうございます。<br>
							今後のカリキュラム改善のため、皆様の率直なご意見をお聞かせください。
						</p>
						
						<!-- アンケートページへのリンクボタン -->
						<a href="EnqueteForm" class="btn btn-primary btn-lg fw-bold px-5 py-3 rounded-pill shadow btn-animate">
							▶ アンケートに回答する
						</a>
					</div>
				</div>

				<!-- 補足情報 (必要であれば) -->
				<div class="row g-4 text-start">
					<div class="col-md-6">
						<div class="card h-100 shadow-sm border-0 rounded-4">
							<div class="card-body p-4">
								<h5 class="fw-bold text-primary">
									⏱️ 所要時間
								</h5>
								<p class="card-text text-muted mb-0">
									アンケートは全5項目で、約3〜5分程度で完了します。
								</p>
							</div>
						</div>
					</div>
					<div class="col-md-6">
						<div class="card h-100 shadow-sm border-0 rounded-4">
							<div class="card-body p-4">
								<h5 class="fw-bold text-primary">
									🔒 プライバシー
								</h5>
								<p class="card-text text-muted mb-0">
									ご回答内容は匿名で集計され、これ以外の目的には使用しません。
								</p>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</main>

	<!-- フッター (アンケートページと統一) -->
	<footer class="bg-dark text-white text-center py-4 mt-auto">
		<div class="container">
			<p class="m-0 small opacity-75">&copy; H2O space - Creative Web Design Seminar 2026</p>
		</div>
	</footer>

	<!-- Bootstrap Bundle with Popper -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

</body>
</html>
